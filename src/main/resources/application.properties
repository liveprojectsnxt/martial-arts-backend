spring.application.name=martial-arts-backend
server.port=8080

# ============================================
# DATABASE CONFIGURATION - SELECTIVE OPTIONS
# ============================================

# OPTION 1: Railway Internal Domain (Most Likely to Work)
 spring.datasource.url=jdbc:postgresql://postgres.railway.internal:5432/railway

# OPTION 2: Railway Public Proxy Domain (Backup)
# spring.datasource.url=jdbc:postgresql://hayabusa.proxy.rlwy.net:5432/railway

# OPTION 3: Internal Domain with SSL Disabled (if SSL issue)
# spring.datasource.url=jdbc:postgresql://postgres.railway.internal:5432/railway?sslmode=disable

# OPTION 4: Using DATABASE_URL variable (Railway Standard)
# spring.datasource.url=${DATABASE_URL}

# ============================================
# DATABASE CREDENTIALS (Common for all options)
# ============================================
spring.datasource.username=postgres
spring.datasource.password=SieElYhuyLDhIcEOSgvRnXdkiAnJVoQo
spring.datasource.driver-class-name=org.postgresql.Driver

# ============================================
# JPA/HIBERNATE SETTINGS
# ============================================
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================
# FILE UPLOAD SETTINGS
# ============================================
spring.web.resources.static-locations=file:/uploads/
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# LOGGING
# ============================================
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.martialarts=DEBUG

# ============================================
# JACKSON
# ============================================
spring.jackson.serialization.fail-on-empty-beans=false