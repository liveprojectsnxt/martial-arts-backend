spring.application.name=martial-arts-backend
server.port=8080

# Database - WORKING
spring.datasource.url=jdbc:postgresql://postgres.railway.internal:5432/railway
spring.datasource.username=postgres
spring.datasource.password=SieElYhuyLDhIcEOSgvRnXdkiAnJVoQo
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# ============================================
# STATIC RESOURCES - FIX (CRITICAL)
# ============================================
# Multiple static locations - JS, CSS, Images sab serve honge
spring.web.resources.static-locations=classpath:/static/,classpath:/public/,classpath:/resources/,classpath:/META-INF/resources/,file:/uploads/
spring.web.resources.add-mappings=true

# ============================================
# FILE UPLOAD
# ============================================
file.upload-dir=/uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# ============================================
# THYMELEAF (for templates)
# ============================================
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false

# Logging
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.com.martialarts=DEBUG

# Jackson
spring.jackson.serialization.fail-on-empty-beans=false