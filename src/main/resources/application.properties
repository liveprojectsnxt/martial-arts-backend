spring.application.name=martial-arts-backend

# 1. Dynamic Port (Railway dynamic port dega, local me 8080 chalega)
server.port=${PORT:8080}

# 2. Database Configuration (Railway par variables lega, local me fallback localhost chalega)
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/martial_arts_db}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:postgres}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:admin}

# 3. Hibernate / JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# 4. File Upload (Multipart) Limits
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=10MB

# 5. Dynamic Upload Directory & Static Resource Location
file.upload-dir=${UPLOAD_DIR:${user.home}/karate_uploads}
spring.web.resources.static-locations=classpath:/static/,classpath:/templates/,${UPLOAD_LOCATION:file:///${user.home}/karate_uploads/}